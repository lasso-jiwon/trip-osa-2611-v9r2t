<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 검색엔진 노출 금지 -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오사카·교토">
<meta name="theme-color" content="#6C4CF1">
<meta name="format-detection" content="telephone=no">
<title>오사카·교토 2박 3일</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236C4CF1'/%3E%3Ccircle cx='50' cy='44' r='16' fill='%23fff'/%3E%3Cpath d='M50 76l-12-20h24z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
:root{
  --pp:#6C4CF1; --pp2:#8B6BFF; --ink:#171623; --ink2:#5A5870; --ink3:#8C8AA0;
  --line:#ECEBF4; --bg:#F6F5FB; --card:#FFFFFF; --gold:#F5B301;
  --tabH:58px; --panelH:50dvh; --panelH-fb:50vh;
  --safeB:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink); background:#DDDCE4; overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* ---------- MAP ---------- */
#map{position:fixed;inset:0;z-index:1;background:#E8E7EF;}
.leaflet-container{font-family:inherit;}
.leaflet-control-attribution{font-size:9px;}
.leaflet-tile{filter:saturate(1.04);}
.pin{
  width:30px;height:30px;border-radius:50%;background:linear-gradient(160deg,#8B6BFF,#6C4CF1);
  border:2.5px solid #fff; box-shadow:0 4px 10px rgba(40,20,90,.38), 0 1px 3px rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; position:relative;
}
.pin.hot{background:linear-gradient(160deg,#FF9A6B,#F5537A);}
.pin.active{transform:scale(1.16); box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(108,76,241,.45),0 6px 16px rgba(40,20,90,.5); z-index:5;}
.pin-wrap{transition:transform .18s ease;}
.pin-num{position:relative;top:-.5px;}
.pin-hot-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#FFD84D;border:1.5px solid #fff;}
.cly{min-width:30px;height:27px;padding:0 8px;border-radius:14px;background:rgba(108,76,241,.95);border:2px solid #fff;
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  letter-spacing:-.02em;box-shadow:0 4px 12px rgba(40,20,90,.42);font-variant-numeric:tabular-nums;white-space:nowrap;}
.cly.sel{background:linear-gradient(160deg,#FF9A6B,#F5537A);}
.leaflet-popup.cp .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 8px 26px rgba(30,20,70,.25);}
.leaflet-popup.cp .leaflet-popup-content{margin:8px;min-width:180px;}
.cpl{display:flex;flex-direction:column;gap:2px;}
.cpl button{border:0;background:none;text-align:left;font:inherit;font-size:12px;color:#2A2740;
  padding:7px 6px;border-radius:8px;display:flex;gap:6px;align-items:center;cursor:pointer;}
.cpl button:active{background:#F1EDFF;}
.cpl button b{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--pp);color:#fff;
  font-size:10px;align-items:center;justify-content:center;flex:0 0 auto;}
/* ---------- TOP BAR ---------- */
#osmcredit{position:fixed;left:12px;top:calc(env(safe-area-inset-top, 0px) + 52px);z-index:14;
  font-size:9px;font-weight:600;color:#4A4860;background:rgba(255,255,255,.82);padding:2px 6px;border-radius:5px;
  letter-spacing:.01em;pointer-events:none;}
#topbar{position:fixed;top:0;left:0;right:0;z-index:15;display:flex;justify-content:space-between;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) 12px 0 12px;pointer-events:none;}
.daypill{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(23,22,35,.88);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:999px;
  padding:8px 13px 8px 11px;font-size:12.5px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22);}
.daypill b{font-weight:800;letter-spacing:.01em;}
.daypill .sep{width:1px;height:11px;background:rgba(255,255,255,.28);}
.daypill .y{opacity:.72;font-weight:600;}
.mapbtns{display:flex;gap:8px;pointer-events:auto;}
.mapbtns button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.96);
  color:#2A2740;font-size:17px;font-weight:700;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.mapbtns button:active{transform:scale(.94);}
.mapbtns button.on{background:var(--pp);color:#fff;}
/* ---------- PANEL ---------- */
#panel{position:fixed;left:0;right:0;bottom:calc(var(--tabH) + var(--safeB));z-index:20;
  height:var(--panelH-fb);height:var(--panelH);
  background:var(--card);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 34px rgba(30,20,70,.16);
  display:flex;flex-direction:column;overflow:hidden;
  transition:height .3s cubic-bezier(.3,.9,.3,1);}
#panel.small{height:27vh;height:27dvh;}
.ph{flex:0 0 auto;padding:8px 18px 0 18px;}
.grab{width:38px;height:4px;border-radius:3px;background:#DCDAED;margin:0 auto 10px;}
.phrow{display:flex;align-items:baseline;gap:8px;}
.phrow h2{margin:0;font-size:18.5px;font-weight:800;letter-spacing:-.03em;}
.phrow .sub{font-size:12px;color:var(--ink3);font-weight:600;}
.phnote{margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--ink2);}
.wx{display:flex;gap:6px;overflow-x:auto;margin:10px -18px 0 -18px;padding:0 18px 2px;scrollbar-width:none;}
.wx::-webkit-scrollbar{display:none;}
.wxc{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:6px 9px;font-size:11.5px;color:var(--ink2);white-space:nowrap;}
.wxc b{color:var(--ink);font-weight:700;}
.wxc .ic{font-size:13px;}
#scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:10px 14px 26px 14px;}
.card{display:flex;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:11px 12px;margin:0 0 9px 0;cursor:pointer;position:relative;transition:border-color .15s, box-shadow .15s, transform .1s;}
.card:active{transform:scale(.988);}
.card.sel{border-color:#CFC4FF;box-shadow:0 6px 18px rgba(108,76,241,.14);}
.cnum{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--pp);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;margin-top:2px;}
.card.hot .cnum{background:linear-gradient(160deg,#FF9A6B,#F5537A);}
.cbody{flex:1 1 auto;min-width:0;}
.ctime{font-size:11.5px;font-weight:700;color:var(--pp);letter-spacing:.01em;display:flex;gap:6px;align-items:center;}
.ctime .stay{color:var(--ink3);font-weight:600;}
.cname{font-size:14.5px;font-weight:750;margin:2px 0 0;letter-spacing:-.02em;line-height:1.3;}
.csum{font-size:11.8px;color:var(--ink2);line-height:1.5;margin:4px 0 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cchips{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
.chip{font-size:10.5px;font-weight:650;color:#5B48C9;background:#F1EDFF;border-radius:6px;padding:2.5px 6px;}
.card.hot .chip{color:#C2415F;background:#FFEFF3;}
.card.now{border-color:#F3C34B;background:#FFFDF4;box-shadow:0 6px 18px rgba(245,179,1,.16);}
.nowtag{position:absolute;top:-8px;right:10px;background:var(--gold);color:#3B2B00;font-size:9.5px;font-weight:800;
  padding:2px 7px;border-radius:7px;letter-spacing:.02em;}
.daysum{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink3);margin:2px 2px 10px;font-weight:600;}
.daysum>span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fitlink{flex:0 0 auto;border:0;background:#F1EDFF;color:#5B48C9;font:inherit;font-size:10.5px;font-weight:750;
  padding:5px 9px;border-radius:8px;cursor:pointer;}
/* ---------- TABS ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tabH) + var(--safeB));
  padding:0 6px var(--safeB) 6px;display:flex;align-items:stretch;gap:2px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);}
#tabs button{flex:1 1 0;border:0;background:none;font:inherit;color:var(--ink3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;position:relative;}
#tabs button .t1{font-size:11.5px;font-weight:800;letter-spacing:-.01em;}
#tabs button .t2{font-size:9.5px;font-weight:600;opacity:.85;}
#tabs button.on{color:var(--pp);}
#tabs button.on:before{content:'';position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--pp);}
#tabs button .dot{position:absolute;top:4px;right:4px;min-width:15px;height:15px;border-radius:8px;
  background:var(--gold);color:#3B2B00;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;
  padding:0 3px;border:1.5px solid #fff;box-sizing:content-box;}
/* ---------- DETAIL ---------- */
#detail{position:fixed;left:0;right:0;bottom:calc(var(--tabH) + var(--safeB));z-index:30;
  height:72dvh;height:72vh;background:var(--card);border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(25,15,60,.26);transform:translateY(112%);
  transition:transform .34s cubic-bezier(.32,.92,.3,1);display:flex;flex-direction:column;overflow:hidden;}
#detail.open{transform:translateY(0);}
.dwrap{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.dgrab{flex:0 0 auto;padding:9px 0 4px;touch-action:none;cursor:grab;}
.dgrab:before{content:'';display:block;width:40px;height:4px;border-radius:3px;background:#DCDAED;margin:0 auto;}
#dbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 18px 30px;}
.dhead{display:flex;gap:11px;align-items:flex-start;padding:2px 0 4px;}
.dnum{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--pp);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:2px;}
.dnum.hot{background:linear-gradient(160deg,#FF9A6B,#F5537A);}
.dhead .hx{flex:1 1 auto;min-width:0;}
.dtime{font-size:12px;font-weight:800;color:var(--pp);}
.dtime .stay{color:var(--ink3);font-weight:600;}
.dhead h3{margin:2px 0 0;font-size:18px;line-height:1.28;letter-spacing:-.035em;font-weight:800;}
.djp{margin-top:2px;font-size:11.5px;color:var(--ink3);font-weight:600;}
.dclose{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);color:var(--ink2);
  font-size:14px;font-weight:700;cursor:pointer;margin-top:2px;}
.dcat{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#5B48C9;
  background:#F1EDFF;border-radius:7px;padding:3px 7px;margin-top:8px;}
.dleg{display:flex;gap:7px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:11px;
  padding:7px 10px;margin-top:9px;font-size:11.5px;color:var(--ink2);font-weight:600;}
.dleg b{color:var(--ink);font-weight:750;}
.dsum{font-size:13px;line-height:1.62;color:#33314A;margin:11px 0 0;}
.sect{margin-top:19px;}
.sect h4{margin:0 0 9px;font-size:12.5px;font-weight:800;letter-spacing:.01em;color:var(--ink);
  display:flex;align-items:center;gap:6px;}
.sect h4:before{content:'';width:3px;height:12px;border-radius:2px;background:var(--pp);}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 13px 30px;}
ol.steps>li:before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;
  background:#F1EDFF;color:var(--pp);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
ol.steps>li:not(:last-child):after{content:'';position:absolute;left:9.5px;top:24px;bottom:2px;width:1.5px;background:#EEEAFF;}
.st{font-size:13.5px;font-weight:750;line-height:1.4;letter-spacing:-.015em;}
.sb{font-size:12.8px;line-height:1.62;color:#42405C;margin-top:3px;}
.sb b{font-weight:750;color:#1F1D33;}
.jp{margin-top:8px;background:#FFF9E9;border:1px solid #F6E7B8;border-left:3px solid var(--gold);border-radius:9px;
  padding:9px 10px;position:relative;}
.jp .jpt{font-size:13.5px;font-weight:700;color:#3A2E05;line-height:1.45;letter-spacing:-.01em;}
.jp .jpr{font-size:11px;color:#8A7420;margin-top:3px;line-height:1.45;}
.jp button{position:absolute;right:7px;top:7px;border:1px solid #EBD79A;background:#fff;color:#7A6516;
  border-radius:7px;font:inherit;font-size:10px;font-weight:700;padding:3px 7px;cursor:pointer;}
.jp button:active{background:#FFF3CE;}
.dsch{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;}
.dsch .r{padding:7px 0;border-bottom:1px dashed #F0EFF7;}
.dsch .r:last-child{border-bottom:0;}
.dsch .r .tm{font-size:11px;font-weight:800;color:var(--pp);letter-spacing:.02em;margin-bottom:3px;}
.dsch .r .tx{font-size:12px;color:var(--ink);font-weight:600;line-height:1.5;}
.dsch .r .nb{font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.4;font-weight:500;}
.dinfo .r{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #F5F4FA;font-size:12.5px;line-height:1.5;}
.dinfo .r:last-child{border-bottom:0;}
.dinfo .k{flex:0 0 66px;font-weight:650;color:var(--ink3);font-size:12px;}
.dinfo .v{flex:1 1 auto;min-width:0;color:var(--ink);font-weight:600;}
.dinfo .v b{font-weight:750;}
.mbtn{display:flex;gap:8px;margin-top:10px;}
.mbtn a{flex:1 1 0;text-align:center;text-decoration:none;font-size:12.5px;font-weight:750;border-radius:10px;padding:10px 4px;}
.mbtn .m1{background:var(--pp);color:#fff;}
.mbtn .m2{background:#F1EDFF;color:#5B48C9;}
.warn{display:flex;gap:8px;background:#FFF3F4;border:1px solid #FFDDE1;border-radius:11px;padding:9px 10px;
  font-size:12.3px;line-height:1.6;color:#8E2F42;margin-bottom:7px;font-weight:600;}
.warn .ic{flex:0 0 auto;}
.tip{display:flex;gap:8px;background:#F2FBF6;border:1px solid #D6F1E2;border-radius:11px;padding:9px 10px;
  font-size:12.3px;line-height:1.6;color:#1F6344;margin-bottom:7px;font-weight:600;}
.tip .ic{flex:0 0 auto;}
/* ---------- CHECKLIST ---------- */
.cprog{display:flex;align-items:center;gap:10px;background:linear-gradient(140deg,#6C4CF1,#8B6BFF);
  border-radius:14px;padding:12px 14px;color:#fff;margin:0 0 12px;}
.cprog .pn{font-size:20px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.cprog .pl{font-size:11px;opacity:.9;line-height:1.4;font-weight:600;}
.cprog .bar{flex:1 1 auto;height:6px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden;}
.cprog .bar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .3s;}
.gtitle{font-size:12px;font-weight:800;color:var(--ink3);margin:14px 4px 7px;letter-spacing:.02em;}
label.ci{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer;}
label.ci input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:20px;height:20px;border:1.8px solid #CFCCE2;
  border-radius:6px;background:#fff;margin:0;position:relative;margin-top:1px;transition:all .15s;}
label.ci input:checked{background:var(--pp);border-color:var(--pp);}
label.ci input:checked:after{content:'';position:absolute;left:6px;top:2.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg);}
label.ci .ci-t{font-size:13px;font-weight:650;line-height:1.42;letter-spacing:-.01em;}
label.ci .ci-n{font-size:10.5px;color:var(--ink3);margin-top:2px;font-weight:600;}
label.ci input:checked ~ .ci-box .ci-t{color:var(--ink3);text-decoration:line-through;}
.ci-box{flex:1 1 auto;min-width:0;}
.memo{margin-top:14px;}
.memo textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:11px;
  font:inherit;font-size:13px;line-height:1.6;resize:vertical;background:#FCFBFF;color:var(--ink);}
.memo textarea:focus{outline:2px solid #DCD3FF;border-color:#CFC4FF;}
.memo .mh{display:flex;justify-content:space-between;align-items:center;margin:0 2px 7px;}
.memo .mh b{font-size:12.5px;}
.memo .mh span{font-size:10.5px;color:#2E9E67;font-weight:700;opacity:0;transition:opacity .3s;}
.memo .mh span.show{opacity:1;}
.rv{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px;}
.rv .rh{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:800;margin-bottom:7px;}
.rv .rr{display:flex;gap:8px;font-size:12px;padding:3px 0;line-height:1.5;}
.rv .rr .k{flex:0 0 62px;color:var(--ink3);font-weight:650;font-size:11.5px;}
.rv .rr .v{flex:1 1 auto;font-weight:650;}
.rv .rr .v b{font-weight:800;}
.tips .rr{display:flex;gap:8px;font-size:12.3px;line-height:1.55;padding:6px 0;border-bottom:1px solid #F5F4FA;}
.tips .rr:last-child{border-bottom:0;}
.tips .rr .k{flex:0 0 62px;font-weight:800;font-size:11px;color:#5B48C9;padding-top:1px;}
.credit{font-size:10px;color:var(--ink3);line-height:1.5;margin:16px 2px 0;text-align:center;}
.credit a{color:inherit;}
.reset{display:block;width:100%;margin-top:14px;border:1px solid var(--line);background:#fff;color:var(--ink3);
  font:inherit;font-size:11.5px;font-weight:700;padding:9px;border-radius:10px;cursor:pointer;}
.hidden{display:none !important;}
@media (min-width: 760px){
  #panel,#detail,#tabs,#topbar{max-width:520px;margin-left:auto;margin-right:auto;}
  #panel,#detail{border-radius:22px 22px 0 0;}
  #osmcredit{left:calc(50% - 260px + 12px);}
}
#toast{position:fixed;left:50%;bottom:calc(var(--tabH) + var(--safeB) + 16px);transform:translate(-50%,20px);
  background:rgba(23,22,35,.94);color:#fff;font-size:12px;font-weight:700;padding:9px 14px;border-radius:999px;
  z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:80vw;text-align:center;}
#toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div id="map"></div>

<div id="osmcredit">&copy; OpenStreetMap</div>

<div id="topbar">
  <div class="daypill" id="daypill"><b id="pillDay">Day 1</b><i class="sep"></i><span class="y" id="pillWhere">오사카</span><i class="sep"></i><span class="y" id="pillDate">11/28 토</span></div>
  <div class="mapbtns">
    <button id="btnFit" aria-label="전체 경로 보기">⤢</button>
    <button id="btnExpand" aria-label="지도 높이">⤒</button>
  </div>
</div>

<section id="panel">
  <div class="ph">

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: false, attributionControl: false, preferCanvas: true, worldCopyJump: true })
  .setView([34.68, 135.50], 12);

const TILE_A = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
const TILE_B = 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png';
let tiles = null, tileErr = 0, fallback = false;
function useTiles(url, label) {
  if (label) { const c = $('#osmcredit'); if (c) c.innerHTML = label; }
  if (tiles) map.removeLayer(tiles);
  const opt = { maxZoom: 19, minZoom: 3, crossOrigin: true };
  if (url.indexOf('{s}') > -1) opt.subdomains = 'abc';
  tiles = L.tileLayer(url, opt).addTo(map);
  tiles.on('tileerror', () => {
    tileErr++;
    if (!fallback && tileErr >= 5) {
      fallback = true; tileErr = 0;
      useTiles(TILE_B, '&copy; OpenStreetMap contributors');
      toast('지도 타일을 대체 지도로 전환했습니다');
    }
  });
  tiles.on('tileload', () => { tileErr = 0; });
}
useTiles(TILE_A, '&copy; Esri, HERE, Garmin, &copy; OpenStreetMap');

const layer = L.layerGroup().addTo(map);

  pins.forEach(p => {
    const pt = map.project([p.lat, p.lng], z);
    let g = groups.find(g2 => g2.pts.every(q => q.distanceTo(pt) < CLUSTER_PX));
    if (!g) { g = { pts: [], members: [] }; groups.push(g); }
    g.pts.push(pt); g.members.push(p);
  });
  return groups;
}

function refreshPins() {
  pinLayer.clearLayers();
  const zoom = map.getZoom();
  clusterPins().forEach(g => {
    if (g.members.length === 1) {
      const p = g.members[0];
      const m = L.marker([p.lat, p.lng], { icon: pinIcon(p.stop, state.sel === p.stop.n), keyboard: false });
      m.on('click', () => openStop(p.stop.n, { fly: true }));
      m.addTo(pinLayer);
    } else {
      const c = g.pts.reduce((a, q) => a.add(q), L.point(0, 0)).divideBy(g.pts.length);
      const ll = map.unproject(c, zoom);
      const hasSel = g.members.some(p => p.stop.n === state.sel);
      const nums = g.members.map(p => p.stop.n);
      const label = nums.length <= 3 ? nums.join('·') : nums.length + '곳';
      const html = `<div class="cly${hasSel ? ' sel' : ''}">${label}</div>`;
      const icon = L.divIcon({ className: '', html, iconSize: [42, 30], iconAnchor: [21, 15] });
      const m = L.marker(ll, { icon, keyboard: false, zIndexOffset: 500 });
      m.on('click', () => {
        const b = L.latLngBounds(g.members.map(p => [p.lat, p.lng]));
        const same = b.getNorthEast().equals(b.getSouthWest());
        if (!same) { map.flyToBounds(b, { padding: [70, 70], maxZoom: 17, duration: .7 }); return; }
        const pop = L.popup({ closeButton: false, offset: [0, -8], className: 'cp' })
          .setLatLng(ll)
          .setContent('<div class="cpl">' + g.members.map(p => `<button data-n="${p.stop.n}"><b>${p.stop.n}</b> ${esc(p.stop.name)}</button>`).join('') + '</div>');
        pop.openOn(map);
        setTimeout(() => {
          document.querySelectorAll('.cpl button').forEach(btn => btn.addEventListener('click', () => {
            map.closePopup();
            openStop(+btn.dataset.n, { fly: true });
          }));
        }, 60);
      });
      m.addTo(pinLayer);
    }
  });
}

function drawDay(id) {
  layer.clearLayers();
  pins = makePins(stopsOf(id));
  const path = pins.map(p => [p.lat, p.lng]);
  if (path.length > 1) {
    L.polyline(path, { color: '#6C4CF1', weight: 3, opacity: .9, dashArray: '1 9', lineCap: 'round' }).addTo(layer);
    L.polyline(path, { color: '#fff', weight: 6, opacity: .5 }).addTo(layer).bringToBack();
  }
  refreshPins();
}

function markerPos(n) {
  const p = pins.find(x => x.stop.n === n);
  return p ? { lat: p.lat, lng: p.lng } : null;
}

function coverPx() {
  const tabH = $('#tabs').offsetHeight;
  const sheet = $('#detail').classList.contains('open') ? $('#detail').offsetHeight : $('#panel').offsetHeight;
  return sheet + tabH;
}

function fitDay(animate = true) {
  const ps = pins.map(p => [p.lat, p.lng]);
  if (!ps.length) return;
  const b = L.latLngBounds(ps);
  const pad = coverPx() + 26;
  const opt = { paddingTopLeft: [34, 74], paddingBottomRight: [34, pad], animate, maxZoom: 16 };
  if (ps.length === 1) map.setView(ps[0], 16, { animate });
  else map.fitBounds(b, opt);
}

function km(a, b) {
  const R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* default day view: the day's densest walking core */
function focusDay(animate = true) {
  if (!pins.length) return;
  if (pins.length <= 3) { fitDay(animate); return; }
  if (pins.length === 1) { map.setView([pins[0].lat, pins[0].lng], 15, { animate }); return; }
  let best = null;
  pins.forEach(a => {
    const grp = pins.filter(b => km(a, b) <= 2.2);
    if (!best || grp.length > best.length) best = grp;
  });
  const b = L.latLngBounds(best.map(p => [p.lat, p.lng]));
  map.fitBounds(b, { paddingTopLeft: [40, 62], paddingBottomRight: [40, Math.round(coverPx()) + 8], maxZoom: 15.7, animate });
}

function flyToStop(stop, zoom) {
  const pt = markerPos(stop.n) || stop;
  const z = Math.max(map.getZoom(), zoom || 16);
  const off = Math.round(coverPx() / 2);
  const target = map.unproject(map.project([pt.lat, pt.lng], z).add([0, off]), z);
  map.flyTo(target, z, { duration: .85 });
}

/* ---------- now / today ---------- */
const TRIP_DAYS = { '2026-11-28': 'd1', '2026-11-29': 'd2', '2026-11-30': 'd3' };
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function todayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function mins(t) {
  const m = String(t).match(/^(\d{1,2}):(\d{2})/);
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}
function nowStop(day) {
  const key = todayKey();
  if (TRIP_DAYS[key] !== day.id) return null;
  const d = new Date(), cur = d.getHours() * 60 + d.getMinutes();
  let next = null;
  for (const s of day.stops) {
    const st = mins(s.time);
    const em = String(s.time).split('–')[1];
    const en = em ? mins(em) : st + 60;
    if (st === null) continue;
    if (cur >= st && cur <= en + 30) return s.n;
    if (st > cur && next === null) next = s.n;
  }
  return next;
}

/* ---------- panel / day list ---------- */
function renderDay(id) {
  const day = dayOf(id);
  state.day = id;
  $('#pH2').textContent = day.label;
  $('#pSub').textContent = day.date + ' · ' + day.where;
  const note = $('#pNote');
  note.textContent = day.note;
  note.classList.remove('hidden');

  // weather chips of that date
  const wx = $('#wx');
  const key = day.date.split(' ')[0];
  const rows = D.weather.filter(w => w.date === key);
  wx.innerHTML = rows.map(w => `<div class="wxc"><span class="ic">${w.icon}</span><span>${esc(w.where)}</span>${w.temp}</div>`).join('');
  wx.classList.toggle('hidden', rows.length === 0);

  const nowN = nowStop(day);
  const sc = $('#scroll');
  sc.innerHTML = `<div class="daysum"><span>📍 ${day.stops.length}곳 · ${esc(day.theme)}</span><button class="fitlink" id="fitlink">⤢ 전체 경로</button></div>` +
    day.stops.map(s => `
      <div class="card ${s.hot ? 'hot' : ''} ${nowN === s.n ? 'now' : ''}" data-n="${s.n}">
        ${nowN === s.n ? '<span class="nowtag">지금 여기</span>' : ''}
        <div class="cnum">${s.n}</div>
        <div class="cbody">
          <div class="ctime">${esc(s.time)}<span class="stay">${esc(s.stay || '')}</span></div>
          <div class="cname">${esc(s.name)}</div>
          <div class="csum">${esc(s.sum)}</div>
          <div class="cchips">${(s.chips || []).map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
        </div>
      </div>`).join('');
  sc.scrollTop = 0;

  $('#pillDay').textContent = day.label;
  $('#pillWhere').textContent = day.where;
  $('#pillDate').textContent = day.date;

  drawDay(id);
  setTimeout(() => { focusDay(false); refreshPins(); }, 60);
}

/* ---------- detail sheet ---------- */
function renderDetail(s) {
  const stepHtml = (s.steps || []).map(([title, body, jp, jpr]) => `
    <li>
      <div class="st">${title}</div>
      <div class="sb">${body}</div>
      ${jp ? `<div class="jp"><div class="jpt">${jp}</div>${jpr ? `<div class="jpr">${jpr}</div>` : ''}
              <button data-copy="${esc(jp)}">복사</button></div>` : ''}
    </li>`).join('');

  const schedHtml = (s.sched && s.sched.length) ? `
    <div class="sect"><h4>시간표 · 배차</h4>
      <div class="dsch">${s.sched.map(([tm, tx, nb]) => `
        <div class="r"><div class="tm">${tm}</div><div class="tx">${tx}</div>${nb ? `<div class="nb">${nb}</div>` : ''}</div>`).join('')}
      </div></div>` : '';

  const infoHtml = `
    <div class="sect"><h4>세부 정보</h4>
      <div class="dinfo">${(s.info || []).map(([k, v]) => `<div class="r"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
      <div class="mbtn">
        <a class="m1" href="${gmDir(s)}" target="_blank" rel="noopener">길찾기</a>
        <a class="m2" href="${gmView(s)}" target="_blank" rel="noopener">구글맵에서 보기</a>
      </div>
    </div>`;

  const warnHtml = (s.warns && s.warns.length) ? `<div class="sect"><h4>주의</h4>${s.warns.map(w => `<div class="warn"><span class="ic">⚠️</span><span>${w}</span></div>`).join('')}</div>` : '';
  const tipHtml = (s.tips && s.tips.length) ? `<div class="sect"><h4>팁</h4>${s.tips.map(t => `<div class="tip"><span class="ic">💡</span><span>${t}</span></div>`).join('')}</div>` : '';

  return `
    <div class="dhead">
      <div class="dnum ${s.hot ? 'hot' : ''}">${s.n}</div>
      <div class="hx">
        <div class="dtime">${esc(s.time)}<span class="stay"> · ${esc(s.stay || '')}</span></div>
        <h3>${esc(s.name)}</h3>
        <div class="djp">${esc(s.jp || '')}</div>
        <div class="dcat">${esc(s.cat || '')}</div>
      </div>
      <button class="dclose" id="dclose" aria-label="닫기">✕</button>
    </div>
    ${s.leg ? `<div class="dleg"><span>${s.leg[0]}</span><b>${esc(s.leg[1])}</b><span>${esc(s.leg[2])}</span></div>` : ''}
    <p class="dsum">${esc(s.sum)}</p>
    <div class="sect"><h4>여기서 할 일</h4><ol class="steps">${stepHtml}</ol></div>
    ${schedHtml}${infoHtml}${warnHtml}${tipHtml}
  `;
}

function openStop(n, opt) {
  const day = dayOf(state.day);
  const s = day.stops.find(x => x.n === n);
  if (!s) return;
  state.sel = n;
  $('#dbody').innerHTML = renderDetail(s);
  $('#dbody').scrollTop = 0;
  const d = $('#detail');
  d.classList.add('open');
  d.setAttribute('aria-hidden', 'false');
  markActive();
  $('#scroll').querySelectorAll('.card').forEach(c => c.classList.toggle('sel', +c.dataset.n === n));
  if (!opt || opt.fly !== false) setTimeout(() => flyToStop(s, opt && opt.zoom), 40);
  $('#dbody').querySelector('#dclose').addEventListener('click', closeDetail);
  $('#dbody').querySelectorAll('[data-copy]').forEach(b => {
    b.addEventListener('click', async () => {
      const txt = b.getAttribute('data-copy');
      try { await navigator.clipboard.writeText(txt); }
      catch (e) {
        const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
        ta.select(); try { document.execCommand('copy'); } catch (_) {} document.body.removeChild(ta);
      }
      b.textContent = '복사됨'; setTimeout(() => { b.textContent = '복사'; }, 1400);
      toast('일본어 문구를 복사했습니다');
    });
  });
}

function closeDetail() {
  $('#detail').classList.remove('open');
  $('#detail').setAttribute('aria-hidden', 'true');
  state.sel = null;
  markActive();
  $('#scroll').querySelectorAll('.card').forEach(c => c.classList.remove('sel'));
}

function markActive() { refreshPins(); }

/* swipe down to close */
(function () {
  const d = $('#detail'), grab = $('#dgrab');
  let y0 = null, dy = 0;
  const start = e => { y0 = (e.touches ? e.touches[0].clientY : e.clientY); dy = 0; d.style.transition = 'none'; };
  const move = e => {
    if (y0 === null) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const bodyTop = $('#dbody').scrollTop <= 0;
    if (!bodyTop && e.target.closest && !e.target.closest('.dgrab')) return;
    dy = Math.max(0, y - y0);
    if (dy > 0) { d.style.transform = `translateY(${dy}px)`; if (e.cancelable) e.preventDefault(); }
  };
  const end = () => {
    if (y0 === null) return;
    d.style.transition = '';
    d.style.transform = '';
    if (dy > 90) closeDetail();
    y0 = null;
  };
  grab.addEventListener('touchstart', start, { passive: true });
  grab.addEventListener('touchmove', move, { passive: false });
  grab.addEventListener('touchend', end);
  grab.addEventListener('touchcancel', end);
  d.addEventListener('touchstart', e => { if ($('#dbody').scrollTop <= 0 || e.target.closest('.dgrab')) start(e); }, { passive: true });
  d.addEventListener('touchmove', move, { passive: false });
  d.addEventListener('touchend', end);
})();

/* ---------- checklist ---------- */
function renderCheck() {
  $('#pH2').textContent = '체크리스트';
  $('#pSub').textContent = '24항목 · 자동 저장';
  $('#pNote').classList.add('hidden');
  $('#wx').classList.add('hidden');
  $('#pillDay').textContent = '체크리스트';
  $('#pillWhere').textContent = '24항목';
  $('#pillDate').textContent = '자동 저장';

  let idx = 0;
  const groups = D.check.map(g => `
    <div class="gtitle">${esc(g.group)}</div>
    ${g.items.map(it => {
      idx++;
      const id = 'c' + idx;
      return `<label class="ci"><input type="checkbox" id="${id}" ${store.checks[id] ? 'checked' : ''}>
        <div class="ci-box"><div class="ci-t">${esc(it.t)}</div>${it.n ? `<div class="ci-n">${esc(it.n)}</div>` : ''}</div></label>`;
    }).join('')}`).join('');

  const reserve = `
    <div class="gtitle">예약 정보 <span style="font-weight:600;color:#B0ADC4">· 예약번호는 캘린더·톡에서 확인</span></div>
    ${D.reserve.map(r => `
      <div class="rv">
        <div class="rh">${r.icon} ${esc(r.title)}</div>
        ${r.rows.map(x => `<div class="rr"><div class="k">${x.k}</div><div class="v">${x.v}</div></div>`).join('')}
      </div>`).join('')}`;

  const tips = `
    <div class="gtitle">여행 팁</div>
    <div class="rv tips">${D.tips.map(t => `<div class="rr"><div class="k">${t.k}</div><div>${t.v}</div></div>`).join('')}</div>`;

  $('#scroll').innerHTML = `
    <div class="cprog">
      <div><div class="pn" id="pn">0/24</div><div class="pl">완료</div></div>
      <div class="bar"><i id="pbar" style="width:0%"></i></div>
    </div>
    ${groups}
    <div class="memo">
      <div class="mh"><b>개인 메모</b><span id="msaved">저장됨</span></div>
      <textarea id="memo" placeholder="현지에서 적을 것 — 산 것, 먹은 것, 다음에 올 곳…">${esc(store.memo || '')}</textarea>
    </div>
    ${reserve}
    ${tips}
    <button class="reset" id="reset">체크·메모 초기화</button>
    <div class="credit">지도 © OpenStreetMap contributors &nbsp;|&nbsp; <a href="https://developer.apple.com/weatherkit/data-source-attribution/" target="_blank" rel="noopener">&#xF8FF; Weather</a></div>
  `;
  const total = D.check.reduce((a, g) => a + g.items.length, 0);
  const upd = () => {
    const n = Object.keys(store.checks).filter(k => store.checks[k]).length;
    const capped = Math.min(n, total);
    $('#pn').textContent = capped + '/' + total;
    $('#pbar').style.width = Math.round(capped / total * 100) + '%';
    const tab = document.querySelector('#tabs button[data-day="check"]');
    if (tab) {
      const left = total - capped;
      tab.querySelector('.dot')?.remove();
      if (left > 0) {
        const d = document.createElement('span'); d.className = 'dot'; d.textContent = left;
        tab.appendChild(d);
      }
    }
  };
  $('#scroll').querySelectorAll('label.ci input').forEach(cb => {
    cb.addEventListener('change', () => { store.checks[cb.id] = cb.checked; save(); upd(); });
  });
  $('#reset').addEventListener('click', () => {
    if (confirm('체크한 항목과 메모를 모두 지울까요?')) {
      store.checks = {}; store.memo = ''; save(); renderCheck(); toast('초기화했습니다');
    }
  });
  let memoT;
  const memo = $('#memo');
  memo.addEventListener('input', () => {
    store.memo = memo.value; save();
    const s = $('#msaved'); s.classList.add('show');
    clearTimeout(memoT); memoT = setTimeout(() => s.classList.remove('show'), 1200);
  });
  upd();
}

/* ---------- tabs ---------- */
function renderTabs() {
  const tabs = $('#tabs');
  tabs.innerHTML = D.days.map(d => `<button data-day="${d.id}"><span class="t1">${d.label} ${d.date.split(' ')[0]}</span><span class="t2">${d.date.split(' ')[1]}</span></button>`).join('')
    + `<button data-day="check"><span class="t1">체크리스트</span><span class="t2">24항목</span></button>`;
  tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => select(b.dataset.day)));
}

function select(key) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.day === key));
  if (key === 'check') { closeDetail(); renderCheck(); return; }
  closeDetail();
  renderDay(key);
}

/* ---------- buttons ---------- */
$('#btnFit').addEventListener('click', () => { if (state.day) { fitDay(true); toast('전체 경로를 봅니다'); } });
$('#btnExpand').addEventListener('click', () => {
  const p = $('#panel');
  const small = p.classList.toggle('small');
  $('#btnExpand').classList.toggle('on', small);
  $('#btnExpand').textContent = small ? '⤓' : '⤒';
  setTimeout(() => { map.invalidateSize(); if (state.day && !$('#detail').classList.contains('open')) fitDay(true); }, 320);
});

/* card taps */
$('#scroll').addEventListener('click', e => {
  if (e.target.closest('#fitlink')) { fitDay(true); toast('전체 경로를 봅니다'); return; }
  const card = e.target.closest('.card');
  if (card) openStop(+card.dataset.n);
});

/* ---------- boot ---------- */
renderTabs();
select(TRIP_DAYS[todayKey()] || 'd1');
window.addEventListener('resize', () => map.invalidateSize());
let zt;
map.on('zoomend', () => { clearTimeout(zt); zt = setTimeout(refreshPins, 120); });
</script>
